<title>地域課題カルテ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#EAEEF3; --surface-3:#DEE4EC;
  --border:#D7DEE8; --ink:#19222F; --ink-muted:#5C6779; --ink-faint:#8993A3;
  --accent:#1F5C99; --accent-ink:#123E6B; --accent-soft:#E3ECF8;
  --sev1:#3E8E7E; --sev2:#7FA65C; --sev3:#D9A544; --sev4:#C1702B; --sev5:#B23A32;
  --good:#2E7D5B; --warn:#C77D12; --crit:#B23A32;
  --shadow:0 1px 2px rgba(20,30,50,.07),0 6px 16px rgba(20,30,50,.07);
  --font-display:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  --font-body:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141920; --surface:#1B222C; --surface-2:#232B37; --surface-3:#2C3542;
    --border:#39424F; --ink:#EAEDF2; --ink-muted:#A7B0BE; --ink-faint:#748094;
    --accent:#5B9BDB; --accent-ink:#BFDBFF; --accent-soft:#20344A;
    --sev1:#4CA894; --sev2:#8FB86B; --sev3:#E0B457; --sev4:#D28546; --sev5:#CC5147;
    --good:#4CA894; --warn:#D9A544; --crit:#CC5147;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141920; --surface:#1B222C; --surface-2:#232B37; --surface-3:#2C3542;
  --border:#39424F; --ink:#EAEDF2; --ink-muted:#A7B0BE; --ink-faint:#748094;
  --accent:#5B9BDB; --accent-ink:#BFDBFF; --accent-soft:#20344A;
  --sev1:#4CA894; --sev2:#8FB86B; --sev3:#E0B457; --sev4:#D28546; --sev5:#CC5147;
  --good:#4CA894; --warn:#D9A544; --crit:#CC5147;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  margin:0; height:100%; overflow:hidden;
}
html{height:100%;}
button,input,select,textarea{font-family:inherit; color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

.app-shell{
  display:grid; grid-template-columns:220px 1fr; height:100%;
}
.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:16px 12px; gap:4px; overflow-y:auto;
}
.brand{
  display:flex; align-items:center; gap:10px; padding:6px 8px 16px;
}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex:none;
}
.brand-text h1{font-size:14px; font-weight:700; line-height:1.3;}
.brand-text span{font-size:11px; color:var(--ink-muted);}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  color:var(--ink-muted); font-size:13px; font-weight:500; cursor:pointer; border:none;
  background:transparent; text-align:left; width:100%;
}
.nav-item svg{width:18px;height:18px;flex:none;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:700;}
.nav-foot{margin-top:auto; padding:10px 8px; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--border);}

.main-col{display:flex; flex-direction:column; height:100%; overflow:hidden;}
.header-bar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 24px; border-bottom:1px solid var(--border); background:var(--surface); flex:none;
}
.header-title h2{font-size:17px;}
.header-title p{margin:2px 0 0; font-size:12px; color:var(--ink-muted);}
.header-actions{display:flex; align-items:center; gap:10px;}
.user-pill{
  display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
  background:var(--surface-2); font-size:12px; color:var(--ink-muted);
}
.user-pill b{color:var(--ink); font-weight:600;}

.view{padding:22px 24px 40px; overflow-y:auto; flex:1;}
.view[hidden]{display:none;}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.view-head h3{font-size:19px;}
.view-head p{margin:4px 0 0; font-size:13px; color:var(--ink-muted); max-width:640px;}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:18px;}
.card + .card{margin-top:16px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.section-title{font-size:14px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
.section-title .count{font-size:11px; font-weight:600; color:var(--ink-faint); background:var(--surface-2); padding:2px 8px; border-radius:999px;}

.input,.select,.textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--ink); font-size:13px;
}
.textarea{resize:vertical; min-height:80px; font-family:var(--font-body);}
label.field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-muted); font-weight:600;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}

/* ---- map ---- */
.map-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.legend{display:flex; align-items:center; gap:14px; font-size:11.5px; color:var(--ink-muted); flex-wrap:wrap;}
.legend-scale{display:flex; align-items:center; gap:4px;}
.legend-scale i{width:14px;height:14px;border-radius:4px;display:inline-block;}
.map-box{
  width:min(560px,100%); aspect-ratio:2/3; max-height:760px; min-height:420px; margin:0 auto;
  border-radius:14px; overflow:hidden;
  border:1px solid var(--border); box-shadow:var(--shadow); background:var(--surface-2);
}
.map-note{margin:10px 0 0; font-size:11px; color:var(--ink-faint); text-align:center;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface); color:var(--ink); box-shadow:0 6px 20px rgba(0,0,0,.25);}
.leaflet-container{background:var(--surface-2); font-family:var(--font-body);}
.leaflet-bar a{background:var(--surface); color:var(--ink); border-bottom-color:var(--border);}
.leaflet-bar a:hover{background:var(--surface-2);}
.leaflet-control-attribution{background:rgba(255,255,255,.82); font-size:10.5px;}
.muni-popup{min-width:150px;}
.muni-popup h5{font-size:13px; margin:0 0 4px; font-family:var(--font-display);}
.muni-popup .region{font-size:11px; color:var(--ink-muted); margin-bottom:8px;}
.muni-popup .score-row{display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:2px;}
.muni-popup .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.muni-popup button{margin-top:8px; width:100%; padding:6px 10px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-size:12px; font-weight:600; cursor:pointer;}

/* ---- karte ---- */
.karte-header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-tile{background:var(--surface-2); border-radius:10px; padding:12px;}
.stat-tile .l{font-size:11px; color:var(--ink-muted); font-weight:600;}
.stat-tile .v{font-family:var(--font-mono); font-size:18px; font-weight:600; margin-top:4px;}
.issue-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border);}
.issue-row:first-child{border-top:none;}
.issue-row .name{flex:1; font-size:13px; font-weight:600;}
.issue-bar-track{width:120px; height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden;}
.issue-bar-fill{height:100%; border-radius:999px;}
.muni-pick-grid{display:flex; flex-wrap:wrap; gap:8px;}
.muni-chip{padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; cursor:pointer;}
.muni-chip:hover{background:var(--surface-2);}

.toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); z-index:60; transition:opacity .3s, transform .3s;}
.toast[hidden]{opacity:0; transform:translateY(8px); pointer-events:none;}

.chart-box{position:relative; height:280px;}
.chart-box.sm{height:220px;}
.empty{color:var(--ink-faint); font-size:13px; padding:20px 0; text-align:center;}
.ai-report h4{font-size:13px; margin:16px 0 8px; color:var(--accent-ink); display:flex; align-items:center; gap:6px;}
.ai-report h4:first-child{margin-top:0;}
.ai-report ul{margin:0; padding-left:18px; font-size:13px; line-height:1.7;}

@media (max-width:780px){
  .app-shell{grid-template-columns:1fr; grid-template-rows:auto 1fr;}
  .sidebar{
    flex-direction:row; overflow-x:auto; overflow-y:hidden; align-items:center;
    border-right:none; border-bottom:1px solid var(--border); padding:10px 12px; gap:6px;
  }
  .brand{padding:0 8px 0 0;}
  .brand-text span{display:none;}
  .nav-item{flex-direction:column; gap:3px; font-size:10.5px; padding:6px 10px; flex:none;}
  .nav-foot{display:none;}
  .header-bar{padding:12px 16px;}
  .view{padding:16px;}
}

/* ---- leaflet (vendored, trimmed) ---- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0;}
.leaflet-container{overflow:hidden;}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none;}
.leaflet-tile::selection{background:transparent;}
.leaflet-safari .leaflet-tile{image-rendering:-webkit-optimize-contrast;}
.leaflet-safari .leaflet-tile-container{width:1600px;height:1600px;-webkit-transform-origin:0 0;}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block;}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important;}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0;}
.leaflet-container img.leaflet-tile{mix-blend-mode:plus-lighter;}
.leaflet-container.leaflet-touch-zoom{-ms-touch-action:pan-x pan-y;touch-action:pan-x pan-y;}
.leaflet-container.leaflet-touch-drag{-ms-touch-action:pinch-zoom;touch-action:none;touch-action:pinch-zoom;}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{-ms-touch-action:none;touch-action:none;}
.leaflet-container{-webkit-tap-highlight-color:transparent;}
.leaflet-container a{-webkit-tap-highlight-color:rgba(51,181,229,.4);}
.leaflet-tile{filter:inherit;visibility:hidden;}
.leaflet-tile-loaded{visibility:inherit;}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800;}
.leaflet-overlay-pane svg{-moz-user-select:none;}
.leaflet-pane{z-index:400;}
.leaflet-tile-pane{z-index:200;}
.leaflet-overlay-pane{z-index:400;}
.leaflet-shadow-pane{z-index:500;}
.leaflet-marker-pane{z-index:600;}
.leaflet-tooltip-pane{z-index:650;}
.leaflet-popup-pane{z-index:700;}
.leaflet-map-pane canvas{z-index:100;}
.leaflet-map-pane svg{z-index:200;}
.leaflet-vml-shape{width:1px;height:1px;}
.lvml{behavior:url(#default#VML);display:inline-block;position:absolute;}
.leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto;}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none;}
.leaflet-top{top:0;}
.leaflet-right{right:0;}
.leaflet-bottom{bottom:0;}
.leaflet-left{left:0;}
.leaflet-control{float:left;clear:both;}
.leaflet-right .leaflet-control{float:right;}
.leaflet-top .leaflet-control{margin-top:10px;}
.leaflet-bottom .leaflet-control{margin-bottom:10px;}
.leaflet-left .leaflet-control{margin-left:10px;}
.leaflet-right .leaflet-control{margin-right:10px;}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear;}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1;}
.leaflet-zoom-animated{transform-origin:0 0;}
svg.leaflet-zoom-animated{will-change:transform;}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1);}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none;}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden;}
.leaflet-interactive{cursor:pointer;}
.leaflet-grab{cursor:grab;}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair;}
.leaflet-popup-pane,.leaflet-control{cursor:auto;}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing;}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none;}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:visiblePainted;pointer-events:auto;}
.leaflet-zoom-box{border:2px dotted #38f;background:rgba(255,255,255,.5);}
.leaflet-container{font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.4);border-radius:4px;}
.leaflet-bar a{border-bottom:1px solid var(--border);width:28px;height:28px;line-height:28px;display:block;text-align:center;text-decoration:none;font:bold 16px sans-serif;}
.leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px;}
.leaflet-bar a:last-child{border-bottom-left-radius:4px;border-bottom-right-radius:4px;border-bottom:none;}
.leaflet-bar a.leaflet-disabled{cursor:default;color:#bbb;}
.leaflet-touch .leaflet-bar a{width:30px;height:30px;line-height:30px;}
.leaflet-control-attribution,.leaflet-control-scale-line{padding:0 6px;font-size:10.5px;line-height:1.6;}
.leaflet-control-attribution a{text-decoration:none;}
.leaflet-control-attribution a:hover{text-decoration:underline;}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px;}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px;}
.leaflet-popup-content{margin:12px 16px;line-height:1.4;font-size:13px;min-height:1px;}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none;}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg);}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:24px;height:24px;font:16px/24px Tahoma,Verdana,sans-serif;color:var(--ink-muted);text-decoration:none;background:transparent;}
.leaflet-popup-scrolled{overflow:auto;}
.leaflet-div-icon{background:#fff;border:1px solid #666;}
.leaflet-tooltip{position:absolute;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--ink);white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.leaflet-tooltip.leaflet-interactive{cursor:pointer;pointer-events:auto;}
</style>

<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">🗺️</div>
      <div class="brand-text">
        <h1>地域課題カルテ</h1>
        <span>大阪府 市町村局振興課</span>
      </div>
    </div>
    <div id="navItems"></div>
    <div class="nav-foot">統計値：e-Stat実データ<br>本番はSupabase接続に切替</div>
  </nav>

  <div class="main-col">
    <header class="header-bar">
      <div class="header-title">
        <h2 id="viewTitle">地域課題マップ</h2>
        <p id="viewSubtitle">大阪府内市町村の8指標を俯瞰します</p>
      </div>
      <div class="header-actions">
        <div class="user-pill">👤 <b>振興課 職員</b>（デモログイン）</div>
      </div>
    </header>

    <!-- MAP -->
    <section class="view" id="view-map">
      <div class="view-head">
        <div>
          <h3>地域課題マップ</h3>
          <p>国土地理院の地図上に市町村を配置し、選択した指標のスコアで色分け表示します。円をクリックすると市町村カルテに移動します。</p>
        </div>
      </div>
      <div class="map-toolbar">
        <label class="field" style="width:220px;">
          <span>表示する指標</span>
          <select class="select" id="mapCategorySelect"></select>
        </label>
        <div class="legend" id="mapLegend" style="margin-left:auto;"></div>
      </div>
      <div class="map-box" id="mapCanvas"></div>
      <p class="map-note">地図データ：国土地理院（<a href="https://maps.gsi.go.jp/development/ich.html" target="_blank" rel="noopener">地理院タイル</a>）</p>
    </section>

    <!-- KARTE -->
    <section class="view" id="view-karte" hidden>
      <div id="karteBody"></div>
    </section>

    <!-- AI -->
    <section class="view" id="view-ai" hidden>
      <div class="view-head">
        <div>
          <h3>AI分析</h3>
          <p>対象範囲を選び「分析を生成」を押すと、共通課題・特徴的な課題・支援方針・広域連携の可能性をまとめます。</p>
        </div>
      </div>
      <div class="card">
        <div class="grid grid-3">
          <label class="field"><span>対象範囲</span><select class="select" id="aiScopeType">
            <option value="all">大阪府全域</option>
            <option value="region">地域ブロック</option>
            <option value="muni">個別市町村</option>
          </select></label>
          <label class="field" id="aiScopeTargetWrap"><span>対象を選択</span><select class="select" id="aiScopeTarget"></select></label>
          <div style="display:flex; align-items:flex-end;"><button class="btn btn-primary" id="btnGenAi" style="width:100%;">分析を生成</button></div>
        </div>
      </div>
      <div class="card" id="aiResult" hidden></div>
      <div class="card empty" id="aiEmpty">対象範囲を選び「分析を生成」を押してください。</div>
    </section>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ===================== ユーティリティ ===================== */
function hashStr(s){
  var h=0; for(var i=0;i<s.length;i++){h=(h*31 + s.charCodeAt(i))>>>0;}
  return (h % 1000)/1000;
}
function clampRound(v){ return Math.max(1, Math.min(5, Math.round(v))); }
function fmtNum(n){ return Number(n).toLocaleString('ja-JP'); }
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(t._h); t._h=setTimeout(function(){t.hidden=true;}, 2400);

var DISASTER_BASE={'sen-nan':3.4,'minami-kawachi':3.6,'kita-kawachi':3.2,'naka-kawachi':3.0,'kita':2.8,'sen-hoku':2.9,'osaka-city':2.6};

var MUNIS = RAW.map(function(r){
  return {
    id:r[0], name:r[1], region:r[2], lat:r[3], lng:r[4],
    population:r[5], popChangeRate:r[6], agingRate:r[7], areaKm2:r[8], households:r[9], fiscalIndex:r[10]
  };
});
var MUNI_BY_ID={}; MUNIS.forEach(function(m){ MUNI_BY_ID[m.id]=m; });

function noise(m,key,scale){ return (hashStr(m.name+key)-0.5)*(scale==null?1.2:scale); }

function computeScores(m){
  var dens = m.population / m.areaKm2;
  var depop = clampRound(3 - m.popChangeRate*1.1 + noise(m,'depop'));
  var aging = clampRound((m.agingRate-15)/5.5 + noise(m,'aging'));
  var vacant = clampRound(depop*0.5 + aging*0.5 + noise(m,'vacant',1.6));
  var transit = clampRound(6 - Math.log10(dens) + noise(m,'transit'));
  var community = clampRound((depop+aging)/2 + noise(m,'community',1.3));
  var successor = clampRound(aging*0.6 + (1-m.fiscalIndex)*3*0.4 + noise(m,'successor'));
  var base = DISASTER_BASE[m.region] || 3.0;
  if(dens<150) base += 0.5;
  var disaster = clampRound(base + noise(m,'disaster',1.5));
  var dx = clampRound(4.2 - m.fiscalIndex*2.4 - Math.log10(dens)*0.15 + noise(m,'dx'));
  return {population:depop, aging:aging, vacant:vacant, transit:transit, community:community, successor:successor, disaster:disaster, dx:dx};
}
MUNIS.forEach(function(m){
  m.scores = computeScores(m);
  var sum=0,n=0; CATEGORIES.forEach(function(c){ sum+=m.scores[c.key]; n++; });
  m.composite = sum/n;
});

function sevHex(score){
  var b = Math.round(Math.max(1,Math.min(5,score)));
  return SEV_HEX[b];
}

function generateReport(scope){
  var list=scope.list;
  var avg={}; CATEGORIES.forEach(function(c){ avg[c.key]=list.reduce(function(s,m){return s+m.scores[c.key];},0)/list.length; });
  var sortedAvg=CATEGORIES.map(function(c){return {key:c.key,label:c.label,v:avg[c.key]};}).sort(function(a,b){return b.v-a.v;});
  var common = sortedAvg.filter(function(c){return c.v>=3.3;}).slice(0,3);
  if(!common.length) common=sortedAvg.slice(0,2);

  var distinctive=[];
  var seenMuni={};
  CATEGORIES.forEach(function(c){
    var maxM=list.slice().sort(function(a,b){return b.scores[c.key]-a.scores[c.key];})[0];
    if(maxM && maxM.scores[c.key]>=4 && (maxM.scores[c.key]-avg[c.key])>=1 && !seenMuni[maxM.id+c.key]){
      distinctive.push(maxM.name+'は「'+c.label+'」課題が特に高い水準（スコア'+maxM.scores[c.key]+'）。');
      seenMuni[maxM.id+c.key]=true;
    }
  });
  distinctive = distinctive.slice(0,4);
  if(!distinctive.length && list.length>1){
    var topOne=list.slice().sort(function(a,b){return b.composite-a.composite;})[0];
    distinctive.push(topOne.name+'は総合スコアが域内で最も高く、重点的な支援対象として検討の余地がある。');
  }
  if(list.length===1){
    distinctive=sortedAvg.slice(0,2).map(function(c){return '「'+c.label+'」のスコアが'+c.v.toFixed(1)+'と高く、他指標に比べ優先度が高い。';});
  }

  var direction = common.map(function(c){
    var actionMap={
      population:'転入促進・関係人口創出策の強化と、既存住民の定住満足度向上策の両輪で推進する。',
      aging:'地域包括ケア体制の強化と、生活支援サービス（買い物・移動支援等）の充実を図る。',
      vacant:'空き家バンクの活用促進と、危険家屋の除却・活用支援制度の周知を強化する。',
      transit:'コミュニティバス・デマンド交通の再編検討と、広域路線との接続改善を進める。',
      community:'地域おこし協力隊等の外部人材活用と、自治会・NPOへの活動支援を拡充する。',
      successor:'事業承継支援や地域人材マッチング事業と連携し、担い手育成を進める。',
      disaster:'避難計画の再点検と、要配慮者支援体制・広域応援協定の強化を図る。',
      dx:'窓口手続きのオンライン化と、職員のDXリテラシー向上研修を優先的に実施する。'
    };
    return actionMap[c.key];
  });

  var coop=[];
  sortedAvg.slice(0,2).forEach(function(c){
    var coopMap={
      population:'近隣市町村と合同の移住・定住促進キャンペーンを検討する余地がある。',
      aging:'医療・介護資源を近隣市町村と共同利用する広域連携が有効。',
      vacant:'空き家バンクのプラットフォームを近隣市町村と共通化し、利便性を高める。',
      transit:'広域幹線路線と各市町村のコミュニティ交通を接続する広域交通計画を検討する。',
      community:'地域活動人材の合同育成講座を近隣市町村と共催する余地がある。',
      successor:'商工会・農業団体と連携した広域の人材マッチング事業を検討する。',
      disaster:'近隣市町村間の相互応援協定・合同防災訓練の拡充が有効。',
      dx:'システム・電子申請基盤の共同利用によりコスト効率を高める余地がある。'
    };
    coop.push(coopMap[c.key]);
  });

  return {
    common: common.map(function(c){return '「'+c.label+'」の平均スコアが'+c.v.toFixed(1)+'と高く、域内の共通課題として挙げられる。';}),
    distinctive: distinctive,
    direction: direction,
    cooperation: Array.from(new Set(coop))
  };
}
function renderAi(){
  updateAiScopeTargetOptions();
}
function runAiAnalysis(){
  var scope=scopeMunis();
  var report=generateReport(scope);
  document.getElementById('aiEmpty').hidden=true;
  var box=document.getElementById('aiResult');
  box.hidden=false;
  box.innerHTML =
    '<div class="section-title">分析結果：'+scope.label+' <span class="count">'+scope.list.length+'市町村</span></div>'+
    '<div class="ai-report">'+
      aiBlock('🔷 共通課題', report.common)+
      aiBlock('🔶 特徴的な課題', report.distinctive)+
      aiBlock('🧭 今後の支援の方向性', report.direction)+
      aiBlock('🤝 広域連携の可能性', report.cooperation)+
    '</div>'+
    '<p style="font-size:11px; color:var(--ink-faint); margin-top:14px;">※本デモは内部ロジックによる自動生成です。本番運用ではSupabase Edge Function経由でOpenAI APIを呼び出し、同様の構造でレポートを生成する設計とします。</p>';
}
function aiBlock(title, items){
  return '<h4>'+title+'</h4><ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
}

/* ===================== 初期化 ===================== */
function init(){
  buildNav();
  buildMapCategorySelect();
  renderMapLegend();
  setView('map');

  document.getElementById('aiScopeType').addEventListener('change', updateAiScopeTargetOptions);
  document.getElementById('btnGenAi').addEventListener('click', runAiAnalysis);
}
document.addEventListener('DOMContentLoaded', init);
})();
</script>
